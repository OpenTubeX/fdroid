name: Publish F-Droid repository

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: OpenTubeX stable or nightly release tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

jobs:
  # Collects the APKs without repository secrets or Pages permissions, because
  # promoting stable runs the application's dependency installation and build.
  prepare:
    name: Prepare APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      promote_stable: ${{ steps.promotion.outputs.promote_stable }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install F-Droid server tools
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Test publishing
        run: python -m unittest discover -s tests -v

      - name: Resolve releases
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          set -euo pipefail
          stable_tag=''
          nightly_tag=''
          if [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            stable_tag="$INPUT_TAG"
          elif [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+$ ]]; then
            nightly_tag="$INPUT_TAG"
          elif [[ -n "$INPUT_TAG" ]]; then
            echo "Expected a stable or nightly OpenTubeX tag, got: $INPUT_TAG" >&2
            exit 1
          fi

          if [[ -z "$stable_tag" ]]; then
            stable_tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi
          if [[ -z "$nightly_tag" ]]; then
            nightly_tag="$(gh release list --repo OpenTubeX/OpenTubeX --limit 100 \
              --json createdAt,isPrerelease,tagName \
              --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly-")))] | sort_by(.createdAt) | last | .tagName // ""')"
          fi

          if [[ ! "$stable_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            echo "Expected a stable tag, got: $stable_tag" >&2
            exit 1
          fi
          stable_version="${BASH_REMATCH[1]}"
          if [[ ! "$nightly_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+)$ ]]; then
            echo "Expected a nightly tag, got: $nightly_tag" >&2
            exit 1
          fi
          nightly_version="${BASH_REMATCH[1]}"

          {
            echo "stable_tag=$stable_tag"
            echo "stable_version=$stable_version"
            echo "nightly_tag=$nightly_tag"
            echo "nightly_version=$nightly_version"
          } >> "$GITHUB_OUTPUT"

      - name: Check out OpenTubeX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenTubeX/OpenTubeX
          ref: ${{ steps.release.outputs.stable_tag }}
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Compare version codes
        id: promotion
        working-directory: source
        env:
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Nightlies use twice their commit count as the version code. Stable
          # releases add one, so they outrank a nightly built from the same commit.
          stable_code="$(( $(git rev-list --count "refs/tags/$STABLE_TAG") * 2 + 1 ))"
          nightly_code="$(( $(git rev-list --count "refs/tags/$NIGHTLY_TAG") * 2 ))"
          promote_stable=false
          if (( stable_code > nightly_code )); then
            promote_stable=true
          fi
          echo "Stable $STABLE_TAG: $stable_code, nightly $NIGHTLY_TAG: $nightly_code, promote stable: $promote_stable"
          {
            echo "stable_code=$stable_code"
            echo "promote_stable=$promote_stable"
          } >> "$GITHUB_OUTPUT"

      - name: Download Android APKs
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ steps.release.outputs.stable_tag }}
          STABLE_VERSION: ${{ steps.release.outputs.stable_version }}
          NIGHTLY_TAG: ${{ steps.release.outputs.nightly_tag }}
          NIGHTLY_VERSION: ${{ steps.release.outputs.nightly_version }}
          PROMOTE_STABLE: ${{ steps.promotion.outputs.promote_stable }}
        shell: bash
        run: |
          set -euo pipefail
          # F-Droid installs the architecture APKs, which have higher version
          # codes. Leaving out the universal APKs keeps the site below 1 GB.
          stable_patterns=()
          nightly_patterns=()
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            stable_patterns+=(--pattern "org.opentubex.app-${STABLE_VERSION}-beta-${abi}.apk")
            stable_patterns+=(--pattern "org.opentubex.app-${STABLE_VERSION}-beta-lite-${abi}.apk")
            nightly_patterns+=(--pattern "opentubex-${NIGHTLY_VERSION}-android-${abi}.apk")
            nightly_patterns+=(--pattern "opentubex-${NIGHTLY_VERSION}-android-lite-${abi}.apk")
          done

          gh release download "$STABLE_TAG" --repo OpenTubeX/OpenTubeX --dir incoming "${stable_patterns[@]}"
          if [[ "$PROMOTE_STABLE" != true ]]; then
            gh release download "$NIGHTLY_TAG" --repo OpenTubeX/OpenTubeX --dir incoming "${nightly_patterns[@]}"
          fi

      - name: Use Java 21
        if: steps.promotion.outputs.promote_stable == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Use Node.js 24
        if: steps.promotion.outputs.promote_stable == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pnpm
        if: steps.promotion.outputs.promote_stable == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: source/package.json
          cache: false

      - name: Set up Go for the Cast sender
        if: steps.promotion.outputs.promote_stable == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/_scripts/cast-sender/go.mod
          cache: false

      - name: Set up Android SDK
        if: steps.promotion.outputs.promote_stable == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;28.2.13676358

      - name: Install Android runtime packer
        if: steps.promotion.outputs.promote_stable == 'true'
        run: sudo apt-get update && sudo apt-get install --yes 7zip

      - name: Build stable code for nightly installations
        if: steps.promotion.outputs.promote_stable == 'true'
        working-directory: source
        env:
          ANDROID_VERSION_CODE: ${{ steps.promotion.outputs.stable_code }}
          ANDROID_VERSION_NAME: ${{ steps.release.outputs.stable_version }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python3 -m unittest discover -s tests/android
          pnpm run capacitor:sync:android
          # The wrapper makes one attempt with a 10 s read timeout, and
          # services.gradle.org sometimes stalls longer from GitHub runners.
          for attempt in 1 2 3 4 5; do
            ./android/gradlew --project-dir android --version >/dev/null && break
            if (( attempt == 5 )); then exit 1; fi
            sleep 30
          done
          ./android/gradlew --project-dir android :app:assembleNightly -PsplitApks \
            -I ../tests/android/build-identity.init.gradle verifyBuildIdentity
          python3 _scripts/android_apks.py android/app/build/outputs/apk/nightly promotion-apks
          ./android/gradlew --project-dir android :app:assembleNightly -PsplitApks -Plite \
            -I ../tests/android/build-identity.init.gradle verifyBuildIdentity
          python3 _scripts/android_apks.py android/app/build/outputs/apk/nightly promotion-lite-apks --lite
          cp promotion{,-lite}-apks/*-{arm64-v8a,armeabi-v7a,x86,x86_64}.apk "$GITHUB_WORKSPACE/incoming/"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: incoming/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Pages skips a deployment whose build version was deployed before, and it
  # only accepts a commit SHA as that version. A nightly dispatch runs on the
  # same main commit as the previous deploy, so every run deploys a new commit
  # with main's tree, kept on the pages-builds branch.
  build-version:
    name: Create Pages build commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Create Pages build commit
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { data: head } = await github.rest.git.getCommit({ ...context.repo, commit_sha: context.sha })
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: `Pages build for run ${context.runId}`,
              tree: head.tree.sha,
              parents: [context.sha],
            })
            try {
              await github.rest.git.updateRef({ ...context.repo, ref: 'heads/pages-builds', sha: commit.sha, force: true })
            } catch (error) {
              if (error.status !== 422) throw error
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/heads/pages-builds', sha: commit.sha })
            }
            core.setOutput('sha', commit.sha)

  publish:
    name: Publish repository
    needs: [prepare, build-version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Use Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install F-Droid server tools
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: repo

      - name: Check out the nightly signing script
        if: needs.prepare.outputs.promote_stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenTubeX/OpenTubeX
          ref: development
          path: signing
          sparse-checkout: |
            _scripts/sign-nightly-apks.sh
            android/nightly.keystore
            android/nightly.lineage
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The stable tag's Gradle signs with the public nightly key. Nightly
      # installations that rotated to the private key reject those APKs.
      - name: Sign promoted APKs with the nightly key
        if: needs.prepare.outputs.promote_stable == 'true'
        env:
          ANDROID_NIGHTLY_KEYSTORE_BASE64: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_BASE64 }}
          ANDROID_NIGHTLY_STORE_PASSWORD: ${{ secrets.ANDROID_NIGHTLY_KEYSTORE_PASSWORD }}
          ANDROID_NIGHTLY_KEYSTORE: ${{ runner.temp }}/nightly-release.keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_NIGHTLY_KEYSTORE_BASE64" || -z "$ANDROID_NIGHTLY_STORE_PASSWORD" ]]; then
            echo 'ANDROID_NIGHTLY_KEYSTORE_BASE64 and ANDROID_NIGHTLY_KEYSTORE_PASSWORD are not configured.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_NIGHTLY_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_NIGHTLY_KEYSTORE"
          chmod 600 "$ANDROID_NIGHTLY_KEYSTORE"
          signing/_scripts/sign-nightly-apks.sh repo/opentubex-*-android-*.apk
          rm -r "$ANDROID_NIGHTLY_KEYSTORE" signing

      - name: Add stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.prepare.outputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # OpenTubeX commits F-Droid's "What's new" text to each stable release tag.
          notes="$(gh api --header 'Accept: application/vnd.github.raw' \
            "repos/OpenTubeX/OpenTubeX/contents/fastlane/metadata/android/en-US/changelogs/default.txt?ref=${STABLE_TAG}")"
          for app_id in org.opentubex.app org.opentubex.app.lite; do
            mkdir -p "metadata/${app_id}/en-US/changelogs"
            printf '%s\n' "$notes" > "metadata/${app_id}/en-US/changelogs/default.txt"
          done

      - name: Add phone screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # OpenTubeX refreshes these on development, and that push publishes a nightly.
          source=fastlane/metadata/android/en-US/images/phoneScreenshots
          screenshots="$RUNNER_TEMP/screenshots"
          mkdir "$screenshots"
          gh api "repos/OpenTubeX/OpenTubeX/contents/${source}?ref=development" \
            --jq '.[] | select(.type == "file") | .name' |
            while read -r name; do
              gh api --header 'Accept: application/vnd.github.raw' \
                "repos/OpenTubeX/OpenTubeX/contents/${source}/${name}?ref=development" > "${screenshots}/${name}"
            done

          for app_id in org.opentubex.app org.opentubex.app.lite org.opentubex.app.nightly org.opentubex.app.nightly.lite; do
            mkdir -p "metadata/${app_id}/en-US/images/phoneScreenshots"
            cp "$screenshots"/* "metadata/${app_id}/en-US/images/phoneScreenshots/"
          done

      - name: Keep the dates of published APKs
        shell: bash
        run: |
          set -euo pipefail
          # F-Droid reads the date each APK was added from the previous index.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/index-v2.json" https://fdroid.opentubex.org/repo/index-v2.json
          mv "$RUNNER_TEMP/index-v2.json" repo/index-v2.json

      - name: Restore repository signing key
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FDROID_KEYSTORE_BASE64" ]]; then
            echo 'FDROID_KEYSTORE_BASE64 is not configured.' >&2
            exit 1
          fi
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > repository.p12
          chmod 600 repository.p12
          chmod 600 config.yml

      - name: Build signed F-Droid index and landing page
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fdroid.py update --pretty --nosign
          python scripts/add-whats-new.py
          fdroid signindex
          python scripts/check-app-icons.py
          mkdir site
          cp --recursive static/. site/
          mv repo site/repo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload repository
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # actions/deploy-pages always uses the run's commit SHA and cancels the
      # deployment after at most 10 minutes, which large syncs can exceed.
      - name: Deploy repository
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BUILD_VERSION: ${{ needs.build-version.outputs.sha }}
        with:
          retries: 3
          script: |
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: process.env.BUILD_VERSION,
              oidc_token: await core.getIDToken(),
            })
            const id = deployment.id ?? deployment.status_url.split('/').pop()
            core.setOutput('page_url', deployment.page_url)
            let status
            do {
              await new Promise(resolve => setTimeout(resolve, 10000))
              ;({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { ...context.repo, id }))
              core.info(`Pages deployment ${id}: ${status}`)
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error(`Pages deployment ${id} ended with ${status}`)
              }
            } while (status !== 'succeed')
