Name: OpenTubeX Lite
Summary: Smaller OpenTubeX without downloads
Description: |-
  OpenTubeX Lite is a smaller build of the OpenTubeX beta for devices with
  little storage. It leaves out yt-dlp and FFmpeg, so downloads, the yt-dlp
  playback engine and cookie-authenticated features are unavailable. It installs
  alongside OpenTubeX with its own settings and libraries.

AntiFeatures:
  NonFreeNet:
    en-US: Videos and metadata are loaded from YouTube.
