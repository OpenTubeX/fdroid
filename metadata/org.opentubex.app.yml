Name: OpenTubeX
Summary: Privacy-focused YouTube client
Description: |-
  OpenTubeX is a privacy-focused YouTube client with a direct local API,
  subscriptions, playlists, SponsorBlock, captions, and configurable playback.

  The Android app is currently an alpha. It uses the existing OpenTubeX Vue
  interface and Shaka player inside a Capacitor shell.

AntiFeatures:
  NonFreeNet:
    en-US: Videos and metadata are loaded from YouTube.
